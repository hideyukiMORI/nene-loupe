<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>NeNe Loupe application icon</title>
  <desc>A screen loupe with a central colour sample surrounded by eight soft pixels.</desc>
  <!-- Pale separation strokes keep the silhouette legible on dark taskbars. -->
  <path d="M169 167L221 219" fill="none" stroke="#C6D3D8" stroke-width="35" stroke-linecap="round"/>
  <path d="M169 167L221 219" fill="none" stroke="#283747" stroke-width="29" stroke-linecap="round"/>

  <circle cx="108" cy="106" r="72" fill="none" stroke="#C6D3D8" stroke-width="22"/>
  <circle cx="108" cy="106" r="72" fill="#D9EEEC" stroke="#283747" stroke-width="16"/>
  <circle cx="108" cy="106" r="61" fill="none" stroke="#F7F5EF" stroke-width="4"/>

  <!-- 74px symmetric mosaic: 18px outer cells, 32px centre, 3px gaps. -->
  <rect x="71" y="69" width="18" height="18" rx="2" fill="#B6DDD6"/>
  <rect x="99" y="69" width="18" height="18" rx="2" fill="#A8D5D0"/>
  <rect x="127" y="69" width="18" height="18" rx="2" fill="#C1E2DB"/>
  <rect x="71" y="97" width="18" height="18" rx="2" fill="#A8D5D0"/>
  <rect x="92" y="90" width="32" height="32" rx="3" fill="#EF856E"/>
  <rect x="127" y="97" width="18" height="18" rx="2" fill="#B6DDD6"/>
  <rect x="71" y="125" width="18" height="18" rx="2" fill="#C1E2DB"/>
  <rect x="99" y="125" width="18" height="18" rx="2" fill="#B6DDD6"/>
  <rect x="127" y="125" width="18" height="18" rx="2" fill="#A8D5D0"/>
</svg>
