<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>NeNe Loupe application icon</title>
  <desc>A solid charcoal loupe pictogram — thick ring and handle — over a full-bleed 2x2 colour checker inherited from the NENE-PIXEL launcher icon.</desc>

  <!-- 背景: 4マスを全面に広げる。gutter なし。外周だけ小角丸 (r=20 / 7.8%)。 -->
  <clipPath id="tile">
    <rect x="0" y="0" width="256" height="256" rx="20" ry="20"/>
  </clipPath>
  <g clip-path="url(#tile)">
    <rect x="0"   y="0"   width="128" height="128" fill="#F5F5F4"/>
    <rect x="128" y="0"   width="128" height="128" fill="#F97316"/>
    <rect x="0"   y="128" width="128" height="128" fill="#14B8A6"/>
    <rect x="128" y="128" width="128" height="128" fill="#F5F5F4"/>
    <!-- 明タスクバーで外形を保つ単色ヘアライン。色は前景と同じ #18181B、可視幅 5 単位 (2.0%) -->
    <rect x="0" y="0" width="256" height="256" rx="20" ry="20"
          fill="none" stroke="#18181B" stroke-width="10"/>
  </g>

  <!-- 前景: 単色 #18181B のみ。太いリング + 太めハンドル。レンズ穴から4マスが見える。 -->
  <g fill="none" stroke="#18181B" stroke-linecap="round">
    <path d="M155 155L208 208" stroke-width="30"/>
    <circle cx="108" cy="108" r="58" stroke-width="24"/>
  </g>
</svg>
